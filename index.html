a(0,0,0,.45)}.mini-workout.active{display:flex;align-items:center;gap:10px}.mini-main{flex:1;min-width:0}.mini-title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-sub{font-size:12px;color:#aaa;margin-top:2px}.mini-btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:9px 11px;font-weight:700}.workout-shell{display:none;position:fixed;inset:0;z-index:180;background:var(--bg);overflow-y:auto;padding:0 15px 120px}.workout-shell.active{display:block}.workout-top{position:sticky;top:0;z-index:20;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;margin:0 -15px 12px;padding:14px 10px;border-bottom:1px solid #222}.workout-top h2{font-size:18px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workout-timer{text-align:center;padding:14px;background:var(--card);border-radius:13px;margin-bottom:12px}.timer-display{font-size:34px;font-weight:800}.timer-label{font-size:12px;color:#888;margin-top:3px}.exercise-progress{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:12px}.progress-dot{min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #333;color:#888;font-size:12px}.progress-dot.current{border-color:var(--blue);color:var(--blue)}.progress-dot.done{background:var(--blue);border-color:var(--blue);color:#fff}.set-head,.set-row{display:grid;grid-template-columns:34px 68px minmax(58px,1fr) minmax(58px,1fr) 42px;gap:6px;align-items:center}.set-head{font-size:11px;color:#888;margin:8px 0}.set-row{margin-bottom:8px}.set-row input{margin:0;padding:10px 4px;text-align:center}.set-num{text-align:center;font-size:12px;color:#888}.previous-cell{text-align:center;font-size:11px;color:#aaa}.done-btn{width:40px;height:40px;border-radius:9px;border:2px solid #3a3a3a;background:none;color:#888;font-size:18px}.done-btn.completed{background:var(--blue);border-color:var(--blue);color:#fff}.previo <body>
<div class="page active" id="page-calendar"><div class="page-title">📅 캘린더</div><div class="month-nav"><button onclick="changeMonth(-1)">◀</button><span class="month-title" id="monthTitle"></span><button onclick="changeMonth(1)">▶</button></div><div class="calendar-grid" id="calendarGrid"></div><div id="dayDetail" style="margin-top:20px"></div></div>

<div class="modal" id="modal-create-routine"><div class="modal-header"><button class="modal-close" onclick="closeModal('modal-create-routine')">취소</button><h2>루틴 만들기</h2><button class="modal-close" onclick="saveRoutine()">저장</button></div><input type="text" id="routineName" placeholder="루틴 이름"><div id="selectedExercises" style="margin-bottom:15px"></div><button class="btn btn-secondary" onclick="openExercisePicker()" style="margin-bottom:15px">+ 운동 추가</button><div id="routineExerciseConfig"></div></div>

<div class="modal" id="modal-assign"><div class="modal-header"><button class="modal-close" onclick="closeModal('modal-assign')">취소</button><h2>루틴 배정</h2><span style="width:45px"></span></div><div style="display:flex;gap:8px;margin-bottom:12px"><button id="slotAM" class="btn btn-primary" onclick="assignSlot='AM';renderAssignSlots()">오전</button><button id="slotPM" class="btn btn-secondary" onclick="assignSlot='PM';renderAssignSlots()">저녁</button><button id="slotETC" class="btn btn-secondary" onclick="assignSlot='기타';renderAssignSlots()">기타</button></div><div id="assignRoutineList"></div></div>
<div class="workout-shell" id="workoutShell"><div class="workout-top"><button class="modal-close" onclick="minimizeWorkout()">⌄ 최소화</button><h2 id="workoutTitle">운동 중</h2><button class="modal-close" onclick="finishWorkout()">완료</button></div><div class="workout-timer"><div class="timer-display" id="workoutTimer">00:00</div><div class="timer-label">운동 시간 · 자동 저장 중</div></div><div class="exercise-progress" id="exerciseProgress"></div><div id="currentExerciseArea"></div><button class="btn btn-danger" style="margin-top:18px" onclick="confirmEndWorkout()">운동 취소</button></div>
<div class="mini-workout" id="miniWorkout" onclick="restoreWorkout()"><div class="mini-main"><div class="mini-title" id="miniTitle">진행 중 운동</div><div class="mini-sub" id="miniSub"></div></div><button class="mini-btn" onclick="event.stopPropagation();restoreWorkout()">돌아가기</button></div>
<div class="rest-banner" id="restBanner"><div><div style="font-size:11px;color:#aaa">휴식</div><div class="rest-time" id="restTimeDisplay">01:30</div></div><div class="rest-info"><div id="restExerciseName" style="font-size:13px;font-weight:700"></div><div style="font-size:11px;color:#888;margin-top:2px">종료시각 기준</div></div><div class="rest-actions"><button onclick="addRest(30)">+30초</button><button onclick="skipRest()">건너뛰기</button></div></div>
<div class="toast" id="toast"></div>

{id:140,name:'폼롤러 (등)',part:'스트레칭'},{id:141,name:'폼롤러 (하체)',part:'스트레칭'},{id:143,name:'고관절 스트레칭',part:'스트레칭'},{id:144,name:'햄스트링 스트레칭',part:'스트레칭'}
];
const PARTS=['전체','가슴','등','어깨','하체','이두','삼두','복근','유산소','스트레칭'];const $=id=>document.getElementById(id);const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const uid=(p='id')=>`${p}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;const exInfo=id=>EXERCISES.find(e=>e.id===id)||{id,name:`운동 #${id}`,part:'기타'};const formatDate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const fmtClock=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(z).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(z).padStart(2,'0')}`};const durationLabel=s=>`${Math.max(1,Math.round(s/60))}분`;function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
let routines=load('routines',[]),schedule=load('schedule',{}),history=load('history',[]),inbodyRecords=load('inbodyRecords',[]),activeSession=load('activeSession',null);
function migrate(){if(load('schemaVersion',1)>=2)return;const ns={};Object.entries(schedule||{}).forEach(([date,p])=>{if(p?.plans){ns[date]=p;return}if(p?.routineId){ns[date]={plans:[{planId:uid('plan'),routineId:p.routineId,slot:'기타'}]};if(p.status==='completed'&&p.log&&!history.some(h=>h.date===date&&h.routineName===(routines.find(r=>r.id===p.routineId)?.name||'')))history.unshift({sessionId:uid('migrated'),date,slot:'기타',routineId:p.routineId,routineName:routines.find(r=>r.id===p.routineId)?.name||'이전 운동',duration:p.duration||'-',durationSec:0,log:p.log,timestamp:Date.parse(date+'T12:00:00')||Date.now()})}});schedule=ns;history=history.map(h=>({...h,sessionId:h.sessionId||uid('session'),slot:h.slot||'기타',durationSec:h.durationSec||0}));save('schedule',schedule);save('history',history);save('schemaVersion',2)}migrate();
let currentTab='calendar';function switchTab(tab){currentTab=tab;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));$('page-'+tab).classList.add('active');document.querySelectorAll('.tab-bar button')[['calendar','routines','history','inbody'].indexOf(tab)].classList.add('active');if(tab==='calendar')renderCalendar();if(tab==='routines')renderRoutines();if(tab==='history')renderHistory();if(tab==='inbody')renderInbody()}
let calYear,calMonth,selectedDate;function initCalendar(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();selectedDate=formatDate(n);renderCalendar()}function changeMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}renderCalendar()}function renderCalendar(){$('monthTitle').textContent=`${calYear}년 ${calMonth+1}월`;const days=['일','월','화','수','목','금','토'];let h=days.map(d=>`<div class="calendar-header">${d}</div>`).join('');const first=new Date(calYear,calMonth,1).getDay(),last=new Date(calYear,calMonth+1,0).getDate(),today=formatDate(new Date());for(let i=0;i<first;i++)h+='<div class="calendar-day empty"></div>';for(let d=1;d<=last;d++){const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let c='calendar-day';if(ds===today)c+=' today';if(ds===selectedDate)c+=' selected';if(history.some(x=>x.date===ds))c+=' completed';else if(schedule[ds]?.plans?.length)c+=' has-plan';h+=`<div class="${c}" onclick="selectedDate='${ds}';renderCalendar()">${d}</div>`}$('calendarGrid').innerHTML=h;renderDayDetail()}
function renderDayDetail(){const plans=schedule[selectedDate]?.plans||[],sessions=history.filter(h=>h.date===selectedDate).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)),d=new Date(selectedDate+'T00:00:00');let h=`<div class="card"><div class="card-title">${d.getMonth()+1}월 ${d.getDate()}일</div>`;if(!plans.length&&!sessions.length)h+='<div class="empty-state">운동 계획이 없습니다</div>';plans.forEach(p=>{const r=routines.find(x=>x.id===p.routineId);if(!r)return;h+=`<div class="session-row"><div style="display:flex;justify-content:space-between"><strong>${p.slot} · ${r.name}</strong><button class="delete-btn" onclick="removePlan('${selectedDate}','${p.planId}')">계획 삭제</button></div><div style="margin-top:6px">${r.exercises.map(e=>`<span class="routine-exercise-tag">${exInfo(e.exerciseId).name}</span>`).join('')}</div><button class="btn btn-primary" style="margin-top:10px" onclick="startWorkout('${selectedDate}','${p.planId}')">운동 시작</button></div>`});sessions.forEach(s=>{h+=`<div class="session-row"><div style="display:flex;justify-content:space-between"><strong>✅ ${s.slot} · ${s.routineName}</strong><button class="delete-btn" onclick="deleteHistoryById('${s.sessionId}')">기록 삭제</button></div><div class="card-sub">${s.duration}</div>${s.log.map(l=>`<div style="font-size:12px;color:#bbb;margin-top:5px">${exInfo(l.exerciseId).name} · ${l.sets.map(x=>`${x.weight||0}kg×${x.reps||0}`).join(' / ')}</div>`).join('')}</div>`});h+=`<button class="btn btn-secondary" style="margin-top:14px" onclick="openAssign()">+ 루틴 배정</button></div>`;$('dayDetail').innerHTML=h}function removePlan(ds,id){if(!confirm('계획만 삭제할까요? 완료 기록은 유지됩니다.'))return;schedule[ds].plans=schedule[ds].plans.filter(p=>p.planId!==id);if(!schedule[ds].plans.length)delete schedule[ds];save('schedule',schedule);renderCalendar()}
let assignDate,assignSlot='AM';function openAssign(){assignDate=selectedDate;assignSlot='AM';renderAssignSlots();$('assignRoutineList').innerHTML=routines.length?routines.map(r=>`<div class="card" onclick="assignRoutine(${r.id})"><div class="card-title">${r.name}</div><div>${r.exercises.map(e=>`<span class="routine-exercise-tag">${exInfo(e.exerciseId).name}</span>`).join('')}</div></div>`).join(''):'<div class="empty-state">루틴을 먼저 만들어주세요</div>';openModal('modal-assign')}function renderAssignSlots(){['AM','PM','ETC'].forEach(k=>{const val=k==='ETC'?'기타':k;$('slot'+k).className='btn '+(assignSlot===val?'btn-primary':'btn-secondary')})}function assignRoutine(id){if(!schedule[assignDate])schedule[assignDate]={plans:[]};schedule[assignDate].plans.push({planId:uid('plan'),routineId:id,slot:assignSlot});save('schedule',schedule);closeModal('modal-assign');renderCalendar()}
let tempExercises=[],pickedIds=[],filterPart='전체';function renderRoutines(){$('routineList').innerHTML=routines.length?routines.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><div class="card-title">${r.name}</div><div class="card-sub">${r.exercises.length}종목</div></div><button class="delete-btn" onclick="deleteRoutine(${r.id})">삭제</button></div><div style="margin-top:8px">${r.exercises.map(e=>`<span class="routine-exercise-tag">${exInfo(e.exerciseId).name}</span>`).join('')}</div></div>`).join(''):'<div class="empty-state">루틴을 만들어보세요</div>'}function openCreateRoutine(){tempExercises=[];$('routineName').value='';renderRoutineConfig();openModal('modal-create-routine')}function deleteRoutine(id){if(confirm('루틴을 삭제할까요?')){routines=routines.filter(r=>r.id!==id);save('routines',routines);renderRoutines()}}function renderRoutineConfig(){$('selectedExercises').innerHTML=tempExercises.map((e,i)=>`<span class="routine-exercise-tag">${exInfo(e.exerciseId).name} <span style="color:#ff453a" onclick="tempExercises.splice(${i},1);renderRoutineConfig()">✕</span></span>`).join('');$('routineExerciseConfig').innerHTML=tempExercises.map((e,i)=>`<div class="card"><div class="card-title">${exInfo(e.exerciseId).name}</div><div style="display:flex;gap:8px"><div><label>세트</label><input type="number" value="${e.sets}" onchange="tempExercises[${i}].sets=+this.value"></div><div><label>횟수</label><input type="number" value="${e.reps}" onchange="tempExercises[${i}].reps=+this.value"></div><div><label>kg</label><input type="number" step="0.5" value="${e.weight}" onchange="tempExercises[${i}].weight=+this.value"></div></div><label>휴식(초)</label><input type="number" value="${e.rest}" onchange="tempExercises[${i}].rest=+this.value"></div>`).join('')}function saveRoutine(){const n=$('routineName').value.trim();if(!n||!tempExercises.length)return alert('루틴 이름과 운동을 입력하세요');routines.push({id:Date.now(),name:n,exercises:tempExercises.map(x=>({...x}))});save('routines',routines);closeModal('modal-create-routine');renderRoutines()}function openExercisePicker(){pickedIds=tempExercises.map(e=>e.exerciseId);filterPart='전체';$('exerciseSearch').value='';renderCategoryFilter();renderExercisePicker();openModal('modal-exercise-picker')}function renderCategoryFilter(){$('categoryFilter').innerHTML=PARTS.map(p=>`<button class="cat-btn ${p===filterPart?'active':''}" onclick="filterPart='${p}';renderCategoryFilter();renderExercisePicker()">${p}</button>`).join('')}function renderExercisePicker(){const q=$('exerciseSearch').value.toLowerCase();let a=EXERCISES;if(filterPart!=='전체')a=a.filter(e=>e.part===filterPart);if(q)a=a.filter(e=>e.name.toLowerCase().includes(q));$('exercisePickerList').innerHTML=a.map(e=>`<div class="exercise-item ${pickedIds.includes(e.id)?'selected':''}" onclick="togglePick(${e.id})"><div><div class="exercise-name">${e.name}</div><div class="exercise-part">${e.part}</div></div><span class="check-mark">✓</span></div>`).join('')}function togglePick(id){pickedIds=pickedIds.includes(id)?pickedIds.filter(x=>x!==id):[...pickedIds,id];renderExercisePicker()}function confirmExercisePick(){const old=new Map(tempExercises.map(e=>[e.exerciseId,e]));tempExercises=pickedIds.map(id=>old.get(id)||{exerciseId:id,sets:3,reps:10,weight:0,rest:90});closeModal('modal-exercise-picker');renderRoutineConfig()}
let currentExIdx=0,tickInterval;function persistActive(){if(activeSession){activeSession.currentExIdx=currentExIdx;activeSession.updatedAt=Date.now();save('activeSession',activeSession)}else localStorage.removeItem('activeSession');renderMini()}function startWorkout(ds,pid){if(activeSession){alert(`현재 ${activeSession.routineName} 운동이 진행 중입니다.`);return restoreWorkout()}const p=(schedule[ds]?.plans||[]).find(x=>x.planId===pid),r=routines.find(x=>x.id===p?.routineId);if(!p||!r)return;activeSession={sessionId:uid('session'),dateStr:ds,slot:p.slot,routineId:r.id,routineName:r.name,startTimestamp:Date.now(),currentExIdx:0,restEndTimestamp:null,exercises:r.exercises.map(e=>({exerciseId:e.exerciseId,plannedSets:e.sets,plannedReps:e.reps,plannedWeight:e.weight,rest:e.rest||90,sets:Array.from({length:e.sets},()=>({weight:e.weight||0,reps:e.reps||0,done:false}))}))};currentExIdx=0;persistActive();restoreWorkout()}function restoreWorkout(){if(!activeSession)return;$('workoutTitle').textContent=`${activeSession.slot} · ${activeSession.routineName}`;$('workoutShell').classList.add('active');currentExIdx=activeSession.currentExIdx||0;renderWorkout();startTicks()}function minimizeWorkout(){$('workoutShell').classList.remove('active');persistActive()}function startTicks(){clearInterval(tickInterval);tickInterval=setInterval(()=>{updateWorkoutClock();renderMiniClock();updateRestTimer()},500)}function updateWorkoutClock(){if(activeSession)$('workoutTimer').textContent=fmtClock((Date.now()-activeSession.startTimestamp)/1000)}function completedSetCount(){let d=0,t=0;(activeSession?.exercises||[]).forEach(e=>e.sets.forEach(s=>{t++;if(s.done)d++}));return[d,t]}function renderMini(){if(!activeSession)return $('miniWorkout').classList.remove('active');$('miniWorkout').classList.add('active');$('miniTitle').textContent=`${activeSession.slot} · ${activeSession.routineName}`;renderMiniClock()}function renderMiniClock(){if(!activeSession)return;const[d,t]=completedSetCount(),elapsed=(Date.now()-activeSession.startTimestamp)/1000,rest=activeSession.restEndTimestamp>Date.now()?` · 휴식 ${fmtClock((activeSession.restEndTimestamp-Date.now())/1000)}`:'';$('miniSub').textContent=`${fmtClock(elapsed)} · ${d}/${t}세트${rest}`}function lastExerciseRecord(id){for(const h of [...history].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))){const l=h.log?.find(x=>x.exerciseId===id);if(l?.sets?.length)return{h,l}}return null}function recentExerciseRecords(id){return[...history].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(h=>({h,l:h.log?.find(x=>x.exerciseId===id)})).filter(x=>x.l?.sets?.length).slice(0,5)}
function renderWorkout(){if(!activeSession)return;const e=activeSession.exercises[currentExIdx],info=exInfo(e.exerciseId),prev=lastExerciseRecord(e.exerciseId);$('exerciseProgress').innerHTML=activeSession.exercises.map((x,i)=>`<div class="progress-dot ${i===currentExIdx?'current':''} ${x.sets.every(s=>s.done)?'done':''}" onclick="currentExIdx=${i};renderWorkout()">${i+1}</div>`).join('');const pb=prev?`<div class="previous-box"><strong>직전 ${prev.h.date}</strong><br>${prev.l.sets.map((s,i)=>`${i+1}세트 ${s.weight||0}kg×${s.reps||0}`).join(' · ')}</div>`:'<div class="previous-box">이전 완료 기록 없음</div>';const rows=e.sets.map((s,i)=>{const p=prev?.l?.sets?.[i];return`<div class="set-row"><div class="set-num">${i+1}</div><div class="previous-cell">${p?`${p.weight||0}×${p.reps||0}`:'-'}</div><input type="number" step="0.5" value="${s.weight}" onchange="updateSet(${currentExIdx},${i},'weight',this.value)"><input type="number" value="${s.reps}" onchange="updateSet(${currentExIdx},${i},'reps',this.value)"><button class="done-btn ${s.done?'completed':''}" onclick="toggleSetDone(${currentExIdx},${i})">✓</button></div>`}).join('');const rec=recentExerciseRecords(e.exerciseId).map(x=>`<div style="font-size:12px;color:#bbb;margin:5px 0"><strong>${x.h.date}</strong> · ${x.l.sets.map(s=>`${s.weight||0}kg×${s.reps||0}`).join(' / ')}</div>`).join('')||'<div class="card-sub">기록 없음</div>';$('currentExerciseArea').innerHTML=`<div class="card"><div class="card-title">${info.name}</div><div class="card-sub">${info.part} · 목표 ${e.plannedSets}세트 × ${e.plannedReps}회 × ${e.plannedWeight}kg · 휴식 ${e.rest}초</div>${pb}<div class="set-head"><span>세트</span><span style="text-align:center">이전</span><span style="text-align:center">kg</span><span style="text-align:center">횟수</span><span style="text-align:center">완료</span></div>${rows}<button class="btn btn-secondary" onclick="addSet(${currentExIdx})" style="margin-top:7px">+ 세트 추가</button><button class="detail-toggle" onclick="$('recentPanel').classList.toggle('active')">최근 기록 5회 보기 ▾</button><div class="recent-panel" id="recentPanel">${rec}</div></div><div style="display:flex;gap:8px">${currentExIdx>0?`<button class="btn btn-secondary" onclick="currentExIdx--;renderWorkout()">◀ 이전</button>`:''}${currentExIdx<activeSession.exercises.length-1?`<button class="btn btn-primary" onclick="currentExIdx++;renderWorkout()">다음 ▶</button>`:''}</div>`;persistActive()}function updateSet(ei,si,f,v){activeSession.exercises[ei].sets[si][f]=Number(v)||0;persistActive()}function toggleSetDone(ei,si){const s=activeSession.exercises[ei].sets[si];s.done=!s.done;if(s.done)startRestTimer(activeSession.exercises[ei].rest||90,exInfo(activeSession.exercises[ei].exerciseId).name);persistActive();renderWorkout()}function addSet(ei){const e=activeSession.exercises[ei],l=e.sets.at(-1)||{weight:0,reps:e.plannedReps};e.sets.push({weight:l.weight,reps:l.reps,done:false});renderWorkout()}function startRestTimer(sec,name){activeSession.restEndTimestamp=Date.now()+sec*1000;activeSession.restExerciseName=name;persistActive();updateRestTimer()}function updateRestTimer(){if(!activeSession?.restEndTimestamp)return $('restBanner').classList.remove('active');const rem=Math.ceil((activeSession.restEndTimestamp-Date.now())/1000);if(rem<=0){activeSession.restEndTimestamp=null;persistActive();return $('restBanner').classList.remove('active')}$('restBanner').classList.add('active');$('restTimeDisplay').textContent=fmtClock(rem);$('restExerciseName').textContent=activeSession.restExerciseName||''}function addRest(sec){activeSession.restEndTimestamp=Math.max(Date.now(),activeSession.restEndTimestamp||Date.now())+sec*1000;persistActive()}function skipRest(){activeSession.restEndTimestamp=null;persistActive();updateRestTimer()}function confirmEndWorkout(){if(confirm('진행 중 운동을 취소할까요? 완료 기록은 저장되지 않습니다.')){activeSession=null;localStorage.removeItem('activeSession');$('workoutShell').classList.remove('active');$('restBanner').classList.remove('active');renderMini()}}function finishWorkout(){if(!activeSession)return;const n=activeSession.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);if(!n)return alert('완료한 세트가 없습니다');if(!confirm(`${n}개 완료 세트를 저장하고 끝낼까요?`))return;const dur=Math.floor((Date.now()-activeSession.startTimestamp)/1000);history.unshift({sessionId:activeSession.sessionId,date:activeSession.dateStr,slot:activeSession.slot,routineId:activeSession.routineId,routineName:activeSession.routineName,duration:durationLabel(dur),durationSec:dur,log:activeSession.exercises.map(e=>({exerciseId:e.exerciseId,sets:e.sets.filter(s=>s.done).map(s=>({weight:s.weight,reps:s.reps}))})).filter(l=>l.sets.length),timestamp:Date.now()});save('history',history);activeSession=null;localStorage.removeItem('activeSession');$('workoutShell').classList.remove('active');$('restBanner').classList.remove('active');renderMini();renderCalendar();toast('운동 완료')}
function renderHistory(){const ym=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`,mw=history.filter(h=>h.date?.startsWith(ym)),tv=mw.reduce((a,h)=>a+h.log.reduce((b,l)=>b+l.sets.reduce((c,s)=>c+(s.weight||0)*(s.reps||0),0),0),0);$('historySummary').innerHTML=`<div class="summary-card"><div style="font-weight:700">이번 달 요약</div><div class="summary-stat"><div class="stat-item"><div class="stat-value">${mw.length}</div><div class="stat-label">운동 횟수</div></div><div class="stat-item"><div class="stat-value">${(tv/1000).toFixed(1)}</div><div class="stat-label">총 볼륨(톤)</div></div></div></div>`;$('historyList').innerHTML=history.length?[...history].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(h=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><div class="card-title">${h.slot} · ${h.routineName}</div><div class="card-sub">${h.date} · ${h.duration}</div></div><button class="delete-btn" onclick="deleteHistoryById('${h.sessionId}')">삭제</button></div>${h.log.map(l=>`<div style="font-size:12px;margin-top:6px">${exInfo(l.exerciseId).name} <span style="color:#888">${l.sets.map(s=>`${s.weight||0}kg×${s.reps||0}`).join(' / ')}</span></div>`).join('')}</div>`).join(''):'<div class="empty-state">아직 기록이 없습니다</div>'}function deleteHistoryById(id){if(confirm('이 기록만 삭제할까요?')){history=history.filter(h=>h.sessionId!==id);save('history',history);renderHistory();renderCalendar()}}
function renderInbody(){$('inbodyDate').value=formatDate(new Date());renderInbodyChart();renderInbodyHistory()}function saveInbody(){const r={date:$('inbodyDate').value,weight:+$('inbodyWeight').value||null,muscle:+$('inbodyMuscle').value||null,fatPct:+$('inbodyFat').value||null,fatMass:+$('inbodyFatMass').value||null,timestamp:Date.now()};if(!r.date||(!r.weight&&!r.muscle&&!r.fatPct))return alert('날짜와 최소 한 항목을 입력하세요');inbodyRecords.push(r);inbodyRecords.sort((a,b)=>a.date.localeCompare(b.date));save('inbodyRecords',inbodyRecords);renderInbody();toast('인바디 저장')}function renderInbodyChart(){if(inbodyRecords.length<2)return $('inbodyChart').innerHTML='<div class="card"><div class="card-sub">2회 이상 기록하면 최근 변화가 표시됩니다</div></div>';const a=inbodyRecords.at(-1),b=inbodyRecords.at(-2);$('inbodyChart').innerHTML=`<div class="summary-card"><div style="font-weight:700">최근 변화</div><div style="margin-top:8px">체중 ${b.weight??'-'} → ${a.weight??'-'}kg<br>골격근 ${b.muscle??'-'} → ${a.muscle??'-'}kg<br>체지방 ${b.fatPct??'-'} → ${a.fatPct??'-'}%</div></div>`}function renderInbodyHistory(){$('inbodyHistory').innerHTML=[...inbodyRecords].reverse().map((r,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><strong>${r.date}</strong><button class="delete-btn" onclick="deleteInbody(${inbodyRecords.length-1-i})">삭제</button></div><div class="card-sub">${r.weight?`체중 ${r.weight}kg · `:''}${r.muscle?`골격근 ${r.muscle}kg · `:''}${r.fatPct?`체지방 ${r.fatPct}%`:''}</div></div>`).join('')}function deleteInbody(i){if(confirm('삭제할까요?')){inbodyRecords.splice(i,1);save('inbodyRecords',inbodyRecords);renderInbody()}}
function openModal(id){$(id).classList.add('active')}function closeModal(id){$(id).classList.remove('active')}document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateWorkoutClock();updateRestTimer();renderMiniClock()}});window.addEventListener('pageshow',()=>{activeSession=load('activeSession',activeSession);if(activeSession){currentExIdx=activeSession.currentExIdx||0;renderMini();startTicks()}});window.addEventListener('beforeunload',persistActive);initCalendar();renderMini();if(activeSession){currentExIdx=activeSession.currentExIdx||0;startTicks()}
</script>
